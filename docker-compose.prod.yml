services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: nba-backend
    ports:
      - "8000:8080"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - nba-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nba-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://nba-backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nba-network

networks:
  nba-network:
    driver: bridge
