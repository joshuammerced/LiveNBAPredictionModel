# Local development: `docker compose up --watch`, then open http://localhost:3000
services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: nba-backend
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    ports:
      - "8000:8080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
    develop:
      watch:
        - path: ./requirements.txt
          action: rebuild
    networks:
      - nba-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nba-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
    develop:
      watch:
        - path: ./frontend/src
          action: rebuild
        - path: ./frontend/public
          action: rebuild
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nba-network

networks:
  nba-network:
    driver: bridge
